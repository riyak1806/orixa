<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Selection | ORIXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="teacher.css">
    <style>
        .back-nav-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 8px;
            width: 100%;
        }

        .back-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-header);
            font-size: 0.9rem;
            color: var(--border-dark);
            text-decoration: none;
            background: var(--color-blue);
            border: var(--border-comic-thin);
            border-radius: 12px;
            padding: 8px 16px;
            box-shadow: var(--shadow-chunky-pressed);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .back-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-chunky-small);
        }

        .back-link-btn:active {
            transform: translateY(1px);
            box-shadow: var(--shadow-chunky-pressed);
        }

        .admin-options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 10px;
            width: 100%;
        }

        .admin-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background-color: var(--surface-white);
            border: var(--border-comic-thin);
            border-radius: 16px;
            box-shadow: var(--shadow-chunky-pressed);
            text-decoration: none;
            color: var(--border-dark);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .admin-card .admin-icon {
            width: 48px;
            height: 48px;
            color: var(--border-dark);
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .admin-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-chunky-small);
            background-color: var(--color-cream);
        }

        .admin-card:hover .admin-icon {
            transform: scale(1.1) rotate(4deg);
        }

        .admin-card-info h2 {
            font-family: var(--font-header);
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .admin-card-info p {
            font-family: var(--font-body);
            font-size: 0.88rem;
            color: #546e7a;
            font-weight: 600;
        }
    </style>
</head>

<body class="teacher-body">
    <canvas id="particles-canvas"></canvas>

    <div class="teacher-page">
        <!-- Back Navigation Button -->
        <div class="back-nav-container">
            <a href="index.html" class="back-link-btn">
                <svg class="monotone-icon" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor" />
                </svg>
                <span>BACK</span>
            </a>
        </div>

        <main class="teacher-card cartoon-panel">
            <header class="teacher-card-header">
                <h1 class="cartoon-logo teacher-logo bounce-anim">ORIXA</h1>
                <p class="cartoon-subtitle teacher-subtitle">Administration Selection</p>
            </header>

            <div class="admin-options-container">
                <!-- College Administration -->
                <div class="admin-card cartoon-panel">
                    <svg class="admin-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" fill="currentColor" />
                    </svg>
                    <div class="admin-card-info">
                        <h2>College Administration</h2>
                        <p>Access college-level administration portal</p>
                    </div>
                </div>

                <!-- Teacher Administration -->
                <div class="admin-card cartoon-panel">
                    <svg class="admin-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor" />
                    </svg>
                    <div class="admin-card-info">
                        <h2>Teacher Administration</h2>
                        <p>Access teacher-level administration portal</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="teacher.js"></script>
</body>

</html>
