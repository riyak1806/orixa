<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Login | ORIXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="teacher.css">
    <style>
        .back-nav-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 8px;
            width: 100%;
        }

        .back-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-header);
            font-size: 0.9rem;
            color: var(--border-dark);
            text-decoration: none;
            background: var(--color-blue);
            border: var(--border-comic-thin);
            border-radius: 12px;
            padding: 8px 16px;
            box-shadow: var(--shadow-chunky-pressed);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .back-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-chunky-small);
        }

        .back-link-btn:active {
            transform: translateY(1px);
            box-shadow: var(--shadow-chunky-pressed);
        }

        .college-submit-btn {
            background: var(--color-blue);
        }

        .college-submit-btn:hover {
            background: #81d4fa;
        }
    </style>
</head>

<body class="teacher-body">
    <canvas id="particles-canvas"></canvas>

    <div class="teacher-page">
        <!-- Back Navigation Button -->
        <div class="back-nav-container">
            <a href="admin-selection.html" class="back-link-btn">
                <svg class="monotone-icon" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor" />
                </svg>
                <span>BACK</span>
            </a>
        </div>

        <main class="teacher-card cartoon-panel">
            <header class="teacher-card-header">
                <h1 class="cartoon-logo teacher-logo bounce-anim" style="color: var(--color-blue);">ORIXA</h1>
                <p class="cartoon-subtitle teacher-subtitle">College Login</p>
            </header>

            <form id="college-login-form" class="teacher-form" novalidate onsubmit="event.preventDefault();">
                <div class="form-field">
                    <label for="college-code" class="field-label">
                        <!-- Building SVG Icon -->
                        <svg class="monotone-icon field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" fill="currentColor" />
                        </svg>
                        <span>COLLEGE CODE / ID</span>
                    </label>
                    <div class="input-shell">
                        <input type="text" id="college-code" name="college_code" class="cartoon-input"
                            placeholder="e.g. COL-101" autocomplete="off">
                    </div>
                </div>

                <div class="form-field">
                    <label for="college-password" class="field-label">
                        <!-- Lock SVG Icon -->
                        <svg class="monotone-icon field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"
                                fill="currentColor" />
                        </svg>
                        <span>PASSWORD</span>
                    </label>
                    <div class="input-shell">
                        <input type="password" id="college-password" name="password" class="cartoon-input"
                            placeholder="Enter administrative password" autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="cartoon-action-btn primary-yellow-btn college-submit-btn teacher-submit-btn"
                    id="college-login-submit-btn">
                    <span class="btn-label">LOG IN</span>
                </button>

                <p class="teacher-form-msg" id="college-form-msg" role="status" aria-live="polite"></p>
            </form>
        </main>
    </div>

    <script src="teacher.js"></script>
</body>

</html>
