<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Login | Computer Department | ORIXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="teacher.css">
    <style>
        .back-nav-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 8px;
            width: 100%;
        }

        .back-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-header);
            font-size: 0.9rem;
            color: var(--border-dark);
            text-decoration: none;
            background: var(--color-blue);
            border: var(--border-comic-thin);
            border-radius: 12px;
            padding: 8px 16px;
            box-shadow: var(--shadow-chunky-pressed);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .back-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-chunky-small);
        }

        .back-link-btn:active {
            transform: translateY(1px);
            box-shadow: var(--shadow-chunky-pressed);
        }

        .dept-tag {
            display: inline-block;
            background: var(--color-cream);
            border: var(--border-comic-thin);
            border-radius: 20px;
            padding: 4px 12px;
            font-family: var(--font-header);
            font-size: 0.8rem;
            color: var(--border-dark);
            margin-top: 4px;
        }
    </style>
</head>

<body class="teacher-body">
    <canvas id="particles-canvas"></canvas>

    <div class="teacher-page">
        <!-- Back Navigation Button -->
        <div class="back-nav-container">
            <a href="college-login.html" class="back-link-btn">
                <svg class="monotone-icon" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor" />
                </svg>
                <span>BACK</span>
            </a>
        </div>

        <main class="teacher-card cartoon-panel">
            <header class="teacher-card-header">
                <h1 class="cartoon-logo teacher-logo bounce-anim" style="color: var(--color-purple);">ORIXA</h1>
                <p class="cartoon-subtitle teacher-subtitle">HOD Login</p>
                <div class="dept-tag">Computer Department (jspmntccs)</div>
            </header>

            <form id="hod-login-form" class="teacher-form" novalidate onsubmit="event.preventDefault();">
                <div class="form-field">
                    <label for="hod-employee-id" class="field-label">
                        <!-- User SVG Icon -->
                        <svg class="monotone-icon field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor" />
                        </svg>
                        <span>HOD EMPLOYEE ID</span>
                    </label>
                    <div class="input-shell">
                        <input type="text" id="hod-employee-id" name="employee_id" class="cartoon-input"
                            placeholder="e.g. HOD-CS-01" autocomplete="off">
                    </div>
                </div>

                <div class="form-field">
                    <label for="hod-password" class="field-label">
                        <!-- Lock SVG Icon -->
                        <svg class="monotone-icon field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"
                                fill="currentColor" />
                        </svg>
                        <span>PASSWORD</span>
                    </label>
                    <div class="input-shell">
                        <input type="password" id="hod-password" name="password" class="cartoon-input"
                            placeholder="Enter password" autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="cartoon-action-btn primary-yellow-btn teacher-submit-btn"
                    id="hod-login-submit-btn">
                    <span class="btn-label">LOG IN</span>
                </button>

                <p class="teacher-form-msg" id="hod-form-msg" role="status" aria-live="polite"></p>
            </form>
        </main>
    </div>

    <script src="teacher.js"></script>
</body>

</html>
