<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORIXA | Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="teacher.css">
    <style>
        .role-selection-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
            width: 100%;
        }

        .role-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            cursor: pointer;
            text-decoration: none;
            color: var(--border-dark);
            text-align: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .role-card .role-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            color: var(--border-dark);
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .role-card:hover .role-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .role-card h2 {
            font-family: var(--font-header);
            font-size: 1.6rem;
            margin-bottom: 8px;
            -webkit-text-stroke: 1.5px var(--border-dark);
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.4);
        }

        .role-card p {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: #546e7a;
            font-weight: 600;
            line-height: 1.3;
        }

        .role-card-teacher {
            background-color: var(--color-yellow);
            box-shadow: 0 8px 0 var(--border-dark);
        }

        .role-card-teacher:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 var(--border-dark);
            background-color: #ffeb3b;
        }

        .role-card-teacher:active {
            transform: translateY(2px);
            box-shadow: var(--shadow-chunky-pressed);
        }

        .role-card-student {
            background-color: var(--color-green);
            box-shadow: 0 8px 0 var(--border-dark);
        }

        .role-card-student:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 var(--border-dark);
            background-color: #a5d6a7;
        }

        .role-card-student:active {
            transform: translateY(2px);
            box-shadow: var(--shadow-chunky-pressed);
        }

        @media (max-width: 480px) {
            .role-selection-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .role-card {
                padding: 24px 16px;
            }
            .role-card h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body class="teacher-body">
    <canvas id="particles-canvas"></canvas>

    <div class="teacher-page">
        <main class="teacher-card cartoon-panel">
            <header class="teacher-card-header">
                <h1 class="cartoon-logo teacher-logo bounce-anim">ORIXA</h1>
                <p class="cartoon-subtitle teacher-subtitle">Choose Your Adventure</p>
            </header>

            <div class="role-selection-container">
                <!-- Teacher Card -->
                <a href="teacher-login.html" class="role-card role-card-teacher cartoon-panel" id="role-btn-teacher">
                    <!-- Graduation Cap SVG Icon -->
                    <svg class="role-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z" />
                    </svg>
                    <h2>TEACHER</h2>
                    <p>Manage quizzes & track student progress</p>
                </a>

                <!-- Student Card -->
                <a href="student-login.html" class="role-card role-card-student cartoon-panel" id="role-btn-student">
                    <!-- Gamepad SVG Icon -->
                    <svg class="role-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21.58 7.47a2 2 0 00-1.4-1.4A22.8 22.8 0 0012 5.5a22.8 22.8 0 00-8.18.57 2 2 0 00-1.4 1.4A22.8 22.8 0 002 12a22.8 22.8 0 00.57 3.82 2 2 0 001.4 1.4 22.8 22.8 0 008.18.57 22.8 22.8 0 008.18-.57 2 2 0 001.4-1.4A22.8 22.8 0 0022 12a22.8 22.8 0 00-.42-4.53zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm7-.25a.75.75 0 11-.75-.75.75.75 0 01.75.75zm1.5 1.5a.75.75 0 11-.75-.75.75.75 0 01.75.75z" />
                    </svg>
                    <h2>STUDENT</h2>
                    <p>Play interactive educational quizzes</p>
                </a>
            </div>
        </main>
    </div>

    <script src="teacher.js"></script>
</body>

</html>
