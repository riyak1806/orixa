<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | ORIXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="teacher.css">
    <style>
        .back-nav-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 8px;
            width: 100%;
        }

        .back-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-header);
            font-size: 0.9rem;
            color: var(--border-dark);
            text-decoration: none;
            background: var(--color-blue);
            border: var(--border-comic-thin);
            border-radius: 12px;
            padding: 8px 16px;
            box-shadow: var(--shadow-chunky-pressed);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .back-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-chunky-small);
        }

        .back-link-btn:active {
            transform: translateY(1px);
            box-shadow: var(--shadow-chunky-pressed);
        }

        .student-submit-btn {
            background: var(--color-green);
        }

        .student-submit-btn:hover {
            background: #a5d6a7;
        }
    </style>
</head>

<body class="teacher-body">
    <canvas id="particles-canvas"></canvas>

    <div class="teacher-page">
        <!-- Back Navigation Button -->
        <div class="back-nav-container">
            <a href="index.html" class="back-link-btn">
                <svg class="monotone-icon" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor" />
                </svg>
                <span>BACK</span>
            </a>
        </div>

        <main class="teacher-card cartoon-panel">
            <header class="teacher-card-header">
                <h1 class="cartoon-logo teacher-logo bounce-anim" style="color: var(--color-green);">ORIXA</h1>
                <p class="cartoon-subtitle teacher-subtitle">Student Login</p>
            </header>

            <form id="student-login-form" class="teacher-form" novalidate>
                <div class="form-field">
                    <label for="student-username" class="field-label">
                        <!-- User SVG Icon -->
                        <svg class="monotone-icon field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor" />
                        </svg>
                        <span>STUDENT ID / USERNAME</span>
                    </label>
                    <div class="input-shell">
                        <input type="text" id="student-username" name="username" class="cartoon-input"
                            placeholder="e.g. STAR_STUDENT" autocomplete="username">
                    </div>
                    <span class="field-error" id="student-username-error"></span>
                </div>

                <div class="form-field">
                    <label for="student-pin" class="field-label">
                        <!-- Key SVG Icon -->
                        <svg class="monotone-icon field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="currentColor" />
                        </svg>
                        <span>ACCESS PIN / PASSWORD</span>
                    </label>
                    <div class="input-shell">
                        <input type="password" id="student-pin" name="pin" class="cartoon-input"
                            placeholder="Enter 4-digit PIN or password" autocomplete="current-password" maxlength="10">
                        <button type="button" class="input-action-btn" id="pin-password-toggle"
                            aria-label="Show password">
                            <svg class="monotone-icon" id="pin-eye-open" viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor" />
                            </svg>
                            <svg class="monotone-icon hidden" id="pin-eye-closed" viewBox="0 0 24 24">
                                <path d="M12 6c3.79 0 7.17 2.13 8.82 5.5a10.1 10.1 0 0 1-2.6 3.44l1.42 1.42c1.39-1.23 2.53-2.77 3.36-4.5C21.27 7.61 17 4.5 12 4.5c-1.27 0-2.49.2-3.64.57l1.65 1.65C10.6 6.24 11.29 6 12 6zm-1.07 1.14L13 9.21c.57.25 1.03.71 1.28 1.28l2.07 2.07c.08-.34.13-.7.13-1.06 0-2.76-2.24-5-5-5-.36 0-.72.05-1.06.13zM2.01 3.87l2.68 2.68A11.738 11.738 0 0 0 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l3.32 3.32 1.41-1.41L3.42 2.45 2.01 3.87zm7.5 7.5 2.61 2.61c-.04.01-.08.02-.12.02-1.66 0-3-1.34-3-3 0-.05.01-.08.02-.12zm-3.9-3.9 1.55 1.55c-.29.71-.46 1.49-.46 2.31 0 1.94.94 3.65 2.38 4.72l1.45 1.45c-2.71-.51-5-2.24-6.2-4.6.51-1.01 1.2-1.9 2.02-2.63l-.74-.8z" fill="currentColor" />
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="student-pin-error"></span>
                </div>

                <div class="form-options-row">
                    <label class="cartoon-checkbox-container teacher-checkbox">
                        <input type="checkbox" id="remember-me-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="checkbox-text">Remember Me</span>
                    </label>
                </div>

                <button type="submit" class="cartoon-action-btn primary-yellow-btn student-submit-btn teacher-submit-btn"
                    id="login-submit-btn">
                    <span class="btn-label">LOG IN</span>
                    <span class="btn-spinner hidden" aria-hidden="true"></span>
                </button>

                <p class="teacher-form-msg" id="login-form-msg" role="status" aria-live="polite"></p>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="orixa-config.js"></script>
    <script src="orixa-auth.js"></script>
    <script src="student.js"></script>
</body>

</html>
